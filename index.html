    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #2a2d34;
            color: #e5e7eb;
        }
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
        }
        .modal.hidden { display: none; }
        .modal { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .modal-content-dark { background-color: #373a40; color: #e5e7eb; }
        
        /* Estilos para el modal de producto */
        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .color-swatch.selected { border-color: #818cf8; }
        
        .size-button {
            border: 1px solid #6b7280;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .size-button.selected { background-color: #818cf8; color: #111827; border-color: #818cf8; }
        
        .slideshow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0,0,0,0.5);
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .slideshow-btn:hover { background-color: rgba(0,0,0,0.8); }
    </style>
</head>

                <button id="close-cart-btn" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div id="cart-items" class="p-4 max-h-80 overflow-y-auto"></div>
            <div class="p-4 border-t border-gray-600 space-y-3">
                <div class="space-y-1 text-lg">
                    <div class="flex justify-between"><span>Subtotal:</span><span id="cart-subtotal">$0.00</span></div>
                    <div class="flex justify-between"><span>Impuestos (<span id="tax-rate-display"></span>%):</span><span id="cart-tax">$0.00</span></div>
                    <div class="flex justify-between font-bold"><span>Total:</span><span id="cart-total">$0.00</span></div>
                </div>
                <button id="checkout-btn" class="w-full bg-green-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-600">Comprar por WhatsApp</button>
            </div>
        </div>
    </div>
    
    <!-- ========== MODAL DE DETALLE DE PRODUCTO ========== -->
    <div id="product-detail-modal" class="modal hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
         <div class="modal-content-dark rounded-lg shadow-xl w-full max-w-4xl max-h-full overflow-y-auto">
            <div class="p-4 border-b border-gray-600 flex justify-between items-center sticky top-0 bg-[#373a40] z-10">
                <h3 id="product-modal-title" class="text-2xl font-semibold"></h3>
                <button id="close-product-modal-btn" class="text-gray-400 hover:text-white text-3xl">&times;</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6">
                <!-- Columna de Imagen -->
                <div class="relative">
                    <div id="product-modal-slideshow" class="w-full h-96 rounded-lg bg-gray-800 flex items-center justify-center overflow-hidden relative">
                        <!-- Las imágenes se insertarán aquí -->
                    </div>
                    <div id="prev-slide-btn" class="slideshow-btn left-2">&lt;</div>
                    <div id="next-slide-btn" class="slideshow-btn right-2">&gt;</div>
                </div>
                <!-- Columna de Opciones -->
                <div class="space-y-4">
                    <div>
                        <label class="font-semibold text-lg">Color:</label>
                        <div id="product-modal-colors" class="flex gap-3 mt-2 flex-wrap"></div>
                    </div>
                    <div id="size-section" class="hidden">
                        <label class="font-semibold text-lg">Talla:</label>
                        <div id="product-modal-sizes" class="flex gap-3 mt-2 flex-wrap"></div>
                    </div>
                    <div>
                        <label for="custom-specs" class="font-semibold text-lg">Especificaciones de personalización:</label>
                        <textarea id="custom-specs" rows="3" class="w-full mt-2 p-2 bg-gray-700 border border-gray-500 rounded-md text-white" placeholder="Ej: 'Quiero el logo en el pecho izquierdo'"></textarea>
                    </div>
                     <div>
                        <label for="ref-image" class="font-semibold text-lg">Imagen de referencia (Opcional):</label>
                        <input type="file" id="ref-image" class="w-full mt-2 text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-500 file:text-white hover:file:bg-indigo-600">
                    </div>
                    <div class="flex items-center gap-4">
                        <label for="quantity" class="font-semibold text-lg">Cantidad:</label>
                        <input type="number" id="quantity" value="1" min="1" class="w-20 text-center border rounded-md p-1 bg-gray-700 border-gray-500 text-white">
                    </div>
                    <div class="text-2xl font-bold text-right">
                        Total: <span id="product-modal-total-price">$0.00</span>
                    </div>
                    <button id="add-to-cart-modal-btn" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700">Añadir al Carrito</button>
                </div>
            </div>
        </div>
    </div>


    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // ========== CONFIGURACIÓN INICIAL ==========
        const whatsappNumber = '18091234567';
        const TAX_RATE = 18; // Tasa de impuesto en porcentaje. Ejemplo: 18% para ITBIS.

        const products = [
            {
                id: 1, name: 'Taza', basePrice: 10.00, type: 'accesory',
                variants: [
                    { color: 'Blanco', colorHex: '#FFFFFF', images: ['assets/taza-blanca.png'] },
                    { color: 'Negro', colorHex: '#000000', images: ['assets/taza-negra.png'] }
                ]
            },
            {
                id: 2, name: 'Camiseta', basePrice: 25.00, type: 'clothing',
                sizes: ['S', 'M', 'L', 'XL'],
                variants: [
                    { color: 'Blanco', colorHex: '#FFFFFF', images: ['assets/camiseta-blanca-frente.png', 'assets/camiseta-blanca-espalda.png'] },
                    { color: 'Negro', colorHex: '#000000', images: ['assets/camiseta-negra-frente.png', 'assets/camiseta-negra-espalda.png'] },
                    { color: 'Rojo', colorHex: '#DC2626', images: ['assets/camiseta-roja.png'] }
                ]
            },
            {
                id: 3, name: 'Hoodie', basePrice: 45.00, type: 'clothing',
                sizes: ['S', 'M', 'L', 'XL'],
                variants: [
                    { color: 'Gris', colorHex: '#6B7280', images: ['assets/hoodie-gris.png'] },
                    { color: 'Azul', colorHex: '#3B82F6', images: ['assets/hoodie-azul.png'] }
                ]
            },
            {
                id: 4, name: 'Gorra', basePrice: 15.00, type: 'accesory',
                variants: [
                    { color: 'Negro', colorHex: '#000000', images: ['assets/gorra-negra.png'] },
                    { color: 'Beige', colorHex: '#F5F5DC', images: ['assets/gorra-beige.png'] }
                ]
            }
        ];

        let cart = [];
        let currentProductState = {};

        // Elementos del DOM
        const productGrid = document.getElementById('product-grid');
        const cartButton = document.getElementById('cart-button');
        const cartModal = document.getElementById('cart-modal');
        const closeCartBtn = document.getElementById('close-cart-btn');
        const cartCount = document.getElementById('cart-count');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartSubtotalEl = document.getElementById('cart-subtotal');
        const cartTaxEl = document.getElementById('cart-tax');
        const cartTotalEl = document.getElementById('cart-total');
        const checkoutBtn = document.getElementById('checkout-btn');
        document.getElementById('tax-rate-display').textContent = TAX_RATE;

        // Elementos del Modal de Producto
        const productDetailModal = document.getElementById('product-detail-modal');
        const closeProductModalBtn = document.getElementById('close-product-modal-btn');
        const productModalTitle = document.getElementById('product-modal-title');
        const slideshow = document.getElementById('product-modal-slideshow');
        const prevBtn = document.getElementById('prev-slide-btn');
        const nextBtn = document.getElementById('next-slide-btn');
        const colorsContainer = document.getElementById('product-modal-colors');
        const sizeSection = document.getElementById('size-section');
        const sizesContainer = document.getElementById('product-modal-sizes');
        const customSpecsInput = document.getElementById('custom-specs');
        const quantityInput = document.getElementById('quantity');
        const modalTotalPrice = document.getElementById('product-modal-total-price');
        const addToCartModalBtn = document.getElementById('add-to-cart-modal-btn');

        // ========== FUNCIONES DE LA APLICACIÓN ==========
        function renderProducts() {
            productGrid.innerHTML = '';
            products.forEach(product => {
                productGrid.innerHTML += `
                    <div class="product-card rounded-lg overflow-hidden shadow-lg flex flex-col" data-id="${product.id}">
                        <!-- Parte de la imagen -->
                        <div class="relative">
                            <img src="${product.variants[0].images[0]}" alt="${product.name}" class="w-full h-64 object-cover">
                            <div class="absolute top-2 right-2 p-1 px-3 bg-black/60 backdrop-blur-sm rounded-full text-white font-semibold text-sm">
                                $${product.basePrice.toFixed(2)}
                            </div>
                        </div>
                        <!-- Parte de la información y botón -->
                        <div class="p-4 text-center flex-grow flex flex-col justify-between bg-[#373a40]">
                            <h3 class="text-lg font-semibold text-white mb-3">${product.name}</h3>
                            <div class="w-full bg-indigo-600 text-white font-semibold py-2 px-6 rounded-lg transition-colors pointer-events-none">
                                Personalizar
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        
        // --- Lógica del Modal de Producto ---
        function openProductModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            currentProductState = {
                product: product,
                variant: product.variants[0],
                size: product.sizes ? product.sizes[0] : null,
                quantity: 1,
                slideIndex: 0
            };
            
            productModalTitle.textContent = product.name;
            
            // Colores
            colorsContainer.innerHTML = '';
            product.variants.forEach((variant, index) => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                if (index === 0) swatch.classList.add('selected');
                swatch.style.backgroundColor = variant.colorHex;
                swatch.dataset.index = index;
                colorsContainer.appendChild(swatch);
            });
            
            // Tallas
            if (product.type === 'clothing' && product.sizes) {
                sizesContainer.innerHTML = '';
                product.sizes.forEach((size, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'size-button';
                    if (index === 0) btn.classList.add('selected');
                    btn.textContent = size;
                    btn.dataset.size = size;
                    sizesContainer.appendChild(btn);
                });
                sizeSection.classList.remove('hidden');
            } else {
                sizeSection.classList.add('hidden');
            }
            
            customSpecsInput.value = '';
            quantityInput.value = 1;
            
            updateProductModalUI();
            productDetailModal.classList.remove('hidden');
        }

        function updateProductModalUI() {
            // Slideshow
            slideshow.innerHTML = '';
            currentProductState.variant.images.forEach((imgSrc, index) => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = 'w-full h-full object-contain absolute transition-opacity duration-300';
                img.style.opacity = index === currentProductState.slideIndex ? '1' : '0';
                slideshow.appendChild(img);
            });
            
            // Precio
            const total = currentProductState.product.basePrice * currentProductState.quantity;
            modalTotalPrice.textContent = `$${total.toFixed(2)}`;
        }

        // --- Lógica del Carrito ---
        function addToCart() {
            const cartItem = {
                cartId: Date.now(), // ID único para este item en el carrito
                productId: currentProductState.product.id,
                name: currentProductState.product.name,
                price: currentProductState.product.basePrice,
                quantity: currentProductState.quantity,
                color: currentProductState.variant.color,
                size: currentProductState.size,
                specs: customSpecsInput.value,
                image: currentProductState.variant.images[0]
            };
            cart.push(cartItem);
            updateCartUI();
            productDetailModal.classList.add('hidden');
        }

        function updateCartUI() {
            renderCartItems();
            updateCartTotals();
            updateCartCount();
        }

        function renderCartItems() {
            cartItemsContainer.innerHTML = '';
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-gray-400 text-center">Tu carrito está vacío.</p>';
                return;
            }
            cart.forEach(item => {
                let details = `Color: ${item.color}`;
                if (item.size) details += `, Talla: ${item.size}`;

                cartItemsContainer.innerHTML += `
                    <div class="flex items-start justify-between py-3 border-b border-gray-600 last:border-b-0">
                        <div class="flex items-start gap-4">
                            <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-cover rounded-md">
                            <div>
                                <p class="font-semibold text-white">${item.name} (x${item.quantity})</p>
                                <p class="text-sm text-gray-400">${details}</p>
                                ${item.specs ? `<p class="text-xs text-gray-400 mt-1 italic">"${item.specs}"</p>` : ''}
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-semibold text-white">$${(item.price * item.quantity).toFixed(2)}</p>
                            <button class="text-red-400 text-xs hover:underline" data-cart-id="${item.cartId}">Eliminar</button>
                        </div>
                    </div>`;
            });
        }
        
        function updateCartTotals() {
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const tax = subtotal * (TAX_RATE / 100);
            const total = subtotal + tax;

            cartSubtotalEl.textContent = `$${subtotal.toFixed(2)}`;
            cartTaxEl.textContent = `$${tax.toFixed(2)}`;
            cartTotalEl.textContent = `$${total.toFixed(2)}`;
        }

        function updateCartCount() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;
        }

        function checkout() {
            if (cart.length === 0) return;
            let message = '¡Hola! 👋 Me gustaría hacer el siguiente pedido:\n\n';
            cart.forEach(item => {
                message += `*Producto:* ${item.name}\n`;
                message += `*Cantidad:* ${item.quantity}\n`;
                message += `*Color:* ${item.color}\n`;
                if (item.size) message += `*Talla:* ${item.size}\n`;
                if (item.specs) message += `*Especificaciones:* ${item.specs}\n`;
                message += `*Subtotal:* $${(item.price * item.quantity).toFixed(2)}\n`;
                message += '------------------------\n';
            });
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const tax = subtotal * (TAX_RATE / 100);
            const total = subtotal + tax;

            message += `\n*Subtotal:* $${subtotal.toFixed(2)}`;
            message += `\n*Impuestos (${TAX_RATE}%):* $${tax.toFixed(2)}`;
            message += `\n*TOTAL DEL PEDIDO:* $${total.toFixed(2)}`;
            
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // ========== MANEJADORES DE EVENTOS ==========
        productGrid.addEventListener('click', (e) => {
            const card = e.target.closest('.product-card');
            if (card) {
                openProductModal(parseInt(card.dataset.id));
            }
        });

        // Eventos de Modales (Cerrar)
        [closeCartBtn, closeProductModalBtn].forEach(btn => btn.addEventListener('click', () => {
            cartModal.classList.add('hidden');
            productDetailModal.classList.add('hidden');
        }));
        [cartModal, productDetailModal].forEach(modal => modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.add('hidden');
        }));
        cartButton.addEventListener('click', () => cartModal.classList.remove('hidden'));
        
        // Eventos del Modal de Producto
        colorsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('color-swatch')) {
                colorsContainer.querySelector('.selected').classList.remove('selected');
                e.target.classList.add('selected');
                currentProductState.variant = currentProductState.product.variants[e.target.dataset.index];
                currentProductState.slideIndex = 0;
                updateProductModalUI();
            }
        });

        sizesContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('size-button')) {
                sizesContainer.querySelector('.selected').classList.remove('selected');
                e.target.classList.add('selected');
                currentProductState.size = e.target.dataset.size;
            }
        });

        quantityInput.addEventListener('change', () => {
            currentProductState.quantity = parseInt(quantityInput.value) || 1;
            updateProductModalUI();
        });
        
        nextBtn.addEventListener('click', () => {
            const maxIndex = currentProductState.variant.images.length - 1;
            currentProductState.slideIndex = currentProductState.slideIndex < maxIndex ? currentProductState.slideIndex + 1 : 0;
            updateProductModalUI();
        });
        
        prevBtn.addEventListener('click', () => {
            const maxIndex = currentProductState.variant.images.length - 1;
            currentProductState.slideIndex = currentProductState.slideIndex > 0 ? currentProductState.slideIndex - 1 : maxIndex;
            updateProductModalUI();
        });

        addToCartModalBtn.addEventListener('click', addToCart);
        
        // Eventos del Carrito
        cartItemsContainer.addEventListener('click', (e) => {
            if (e.target.dataset.cartId) {
                const cartId = parseInt(e.target.dataset.cartId);
                cart = cart.filter(item => item.cartId !== cartId);
                updateCartUI();
            }
        });
        
        checkoutBtn.addEventListener('click', checkout);

        // ========== INICIALIZACIÓN ==========
        renderProducts();
    });
    </script>
</body>
</html>
