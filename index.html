        body {
            font-family: 'Inter', sans-serif;
            background-color: #2a2d34;
            color: #e5e7eb;
        }
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
        }
        .modal.hidden { display: none; }
        .modal { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .modal-content-dark { background-color: #373a40; color: #e5e7eb; }
        
        .selection-button {
            border: 1px solid #6b7280;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        .selection-button.selected { background-color: #818cf8; color: #111827; border-color: #818cf8; font-weight: 600; }
        
        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .color-swatch.selected { border-color: #818cf8; }

        .slideshow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0,0,0,0.5);
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .slideshow-btn:hover { background-color: rgba(0,0,0,0.8); }
    </style>

    </div>


    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // ========== CONFIGURACIÓN GLOBAL ==========
        let whatsappNumber = '18091234567'; // Internacional por defecto
        let TAX_RATE = 8; // Impuesto internacional por defecto (ej. 8%)
        let currencySymbol = '$';
        let currencyCode = 'USD';

        // Estructura de productos con precios por variante y talla
        const products = [
            {
                id: 1, name: 'Taza', type: 'accesory',
                variants: [
                    { 
                        style: 'Taza Blanca', 
                        priceUSD: 10.00, priceDOP: 550.00,
                        colors: [
                            { name: 'Blanco', hex: '#FFFFFF', images: ['assets/taza-blanca.png'] },
                        ]
                    },
                    { 
                        style: 'Taza Negra Mágica',

                        colors: [
                           { name: 'Negro', hex: '#000000', images: ['assets/taza-negra.png'] }
                        ]
                    }
                ]
            },
            {
                id: 2, name: 'Camiseta', type: 'clothing',
                sizes: ['S', 'M', 'L', 'XL', 'XXL'],
                variants: [
                    { 
                        style: 'Algodón', 
                        prices: { // Precios por talla para este estilo

                        },
                        colors: [
                            { name: 'Blanco', hex: '#FFFFFF', images: ['assets/camiseta-blanca-frente.png', 'assets/camiseta-blanca-espalda.png'] },
                            { name: 'Negro', hex: '#000000', images: ['assets/camiseta-negra-frente.png', 'assets/camiseta-negra-espalda.png'] },
                        ]
                    },
                    { 
                        style: 'Poliéster Dry-Fit',
                        prices: {
                            'S': { priceUSD: 30.00, priceDOP: 1700.00 },
                            'M': { priceUSD: 30.00, priceDOP: 1700.00 },
                            'L': { priceUSD: 32.00, priceDOP: 1850.00 },
                            'XL': { priceUSD: 33.00, priceDOP: 1900.00 },
                            'XXL': { priceUSD: 35.00, priceDOP: 2050.00 }
                        },
                        colors: [
                            { name: 'Rojo', hex: '#DC2626', images: ['assets/camiseta-roja.png'] }
                        ]
                    }
                ]
            },
            {
                id: 3, name: 'Hoodie', type: 'clothing',
                sizes: ['S', 'M', 'L', 'XL'],
                variants: [
                    { 
                        style: 'Algodón Gris',
                        prices: {
                            'S': { priceUSD: 45.00, priceDOP: 2500.00 },
                            'M': { priceUSD: 45.00, priceDOP: 2500.00 },
                            'L': { priceUSD: 48.00, priceDOP: 2700.00 },
                            'XL': { priceUSD: 50.00, priceDOP: 2800.00 }
                        },
                        colors: [
                            { name: 'Gris', hex: '#6B7280', images: ['assets/hoodie-gris.png'] }
                        ]
                    },
                    { 
                        style: 'Felpa Azul',
                        prices: {
                            'S': { priceUSD: 50.00, priceDOP: 2800.00 },
                            'M': { priceUSD: 50.00, priceDOP: 2800.00 },
                            'L': { priceUSD: 53.00, priceDOP: 3000.00 },
                            'XL': { priceUSD: 55.00, priceDOP: 3100.00 }
                        },
                         colors: [
                            { name: 'Azul', hex: '#3B82F6', images: ['assets/hoodie-azul.png'] }
                        ]
                    }
                ]
            },
            {
                id: 5, name: 'Llavero', type: 'accesory',
                variants: [
                    { style: 'Metálico Circular', priceUSD: 12.00, priceDOP: 650.00, colors: [{ name: 'Plateado', hex: '#C0C0C0', images: ['assets/llavero-metalico.png'] }] },
                    { style: 'Acrílico Cuadrado', priceUSD: 10.00, priceDOP: 550.00, colors: [{ name: 'Transparente', hex: '#E5E7EB', images: ['assets/llavero-acrilico.png'] }] },
                    { style: 'Polímero Rectangular', priceUSD: 8.00, priceDOP: 450.00, colors: [{ name: 'Blanco', hex: '#FFFFFF', images: ['assets/llavero-polimero.png'] }] }
                ]
            }
        ];

        let cart = [];
        let currentProductState = {};

        // Elementos del DOM
        const productGrid = document.getElementById('product-grid');
        const cartButton = document.getElementById('cart-button');
        const cartModal = document.getElementById('cart-modal');
        const closeCartBtn = document.getElementById('close-cart-btn');
        const cartCount = document.getElementById('cart-count');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartSubtotalEl = document.getElementById('cart-subtotal');
        const cartTaxEl = document.getElementById('cart-tax');
        const cartTotalEl = document.getElementById('cart-total');
        const checkoutBtn = document.getElementById('checkout-btn');
        const taxRateDisplay = document.getElementById('tax-rate-display');

        const nameModal = document.getElementById('name-modal');
        const customerNameInput = document.getElementById('customer-name');
        const confirmNameBtn = document.getElementById('confirm-name-btn');
        const cancelNameBtn = document.getElementById('cancel-name-btn');

        const productDetailModal = document.getElementById('product-detail-modal');
        const closeProductModalBtn = document.getElementById('close-product-modal-btn');
        const productModalTitle = document.getElementById('product-modal-title');
        const slideshow = document.getElementById('product-modal-slideshow');
        const prevBtn = document.getElementById('prev-slide-btn');
        const nextBtn = document.getElementById('next-slide-btn');
        const stylesContainer = document.getElementById('product-modal-styles');
        const colorsContainer = document.getElementById('product-modal-colors');
        const sizeSection = document.getElementById('size-section');
        const sizesContainer = document.getElementById('product-modal-sizes');
        const customSpecsInput = document.getElementById('custom-specs');
        const quantityInput = document.getElementById('quantity');
        const modalTotalPrice = document.getElementById('product-modal-total-price');
        const addToCartModalBtn = document.getElementById('add-to-cart-modal-btn');
        

        function getPrice(variant, size) {
            if (variant.prices && size) { // Para ropa con tallas
                const priceData = variant.prices[size];
                return currencyCode === 'DOP' ? priceData.priceDOP : priceData.priceUSD;
            }
            // Para accesorios sin tallas
            return currencyCode === 'DOP' ? variant.priceDOP : variant.priceUSD;
        }
        
        function formatPrice(amount) {
            return `${currencySymbol}${amount.toFixed(2)}`;
        }

        function renderProducts() {
            productGrid.innerHTML = '';
            products.forEach(product => {
                const firstVariant = product.variants[0];
                let price;
                if (product.type === 'clothing') {
                     price = getPrice(firstVariant, product.sizes[0]);
                } else {
                     price = getPrice(firstVariant, null);
                }

                productGrid.innerHTML += `
                    <div class="product-card rounded-lg overflow-hidden shadow-lg flex flex-col" data-id="${product.id}">
                        <div class="relative">
                            <img src="${firstVariant.colors[0].images[0]}" alt="${product.name}" class="w-full h-64 object-cover">
                            <div class="absolute top-2 right-2 p-1 px-3 bg-black/60 backdrop-blur-sm rounded-full text-white font-semibold text-sm">
                                Desde ${formatPrice(price)}
                            </div>
                        </div>
                        <div class="p-4 text-center flex-grow flex flex-col justify-between bg-[#373a40]">
                            <h3 class="text-lg font-semibold text-white mb-3">${product.name}</h3>
                            <div class="w-full bg-indigo-600 text-white font-semibold py-2 px-6 rounded-lg transition-colors pointer-events-none">
                                Ver Opciones
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        
        function openProductModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const initialVariant = product.variants[0];
            const initialColor = initialVariant.colors[0];
            const initialSize = product.sizes ? product.sizes[0] : null;

            currentProductState = {
                product: product,
                variant: initialVariant,
                color: initialColor,
                size: initialSize,
                quantity: 1,
                slideIndex: 0
            };
            
            productModalTitle.textContent = product.name;
            populateStyles(product.variants, 0);
            populateColors(initialVariant.colors, 0);
            
            if (product.type === 'clothing' && product.sizes) {
                populateSizes(product.sizes, 0);
                sizeSection.classList.remove('hidden');
            } else {
                sizeSection.classList.add('hidden');
            }
            
            customSpecsInput.value = '';
            quantityInput.value = 1;
            
            updateProductModalUI();
            productDetailModal.classList.remove('hidden');
        }

        function populateStyles(variants, selectedIndex) {
            stylesContainer.innerHTML = '';
            variants.forEach((variant, index) => {
                const btn = document.createElement('button');
                btn.className = 'selection-button';
                if (index === selectedIndex) btn.classList.add('selected');
                btn.textContent = variant.style;
                btn.dataset.index = index;
                stylesContainer.appendChild(btn);
            });
        }

        function populateColors(colors, selectedIndex) {
            colorsContainer.innerHTML = '';
             colors.forEach((color, index) => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                if (index === selectedIndex) swatch.classList.add('selected');
                swatch.style.backgroundColor = color.hex;
                swatch.dataset.index = index;
                colorsContainer.appendChild(swatch);
            });
        }

        function populateSizes(sizes, selectedIndex) {
             sizesContainer.innerHTML = '';
            sizes.forEach((size, index) => {
                const btn = document.createElement('button');
                btn.className = 'selection-button';
                if (index === selectedIndex) btn.classList.add('selected');
                btn.textContent = size;
                btn.dataset.size = size;
                sizesContainer.appendChild(btn);
            });
        }

        function updateProductModalUI() {
            // Actualizar slideshow
            slideshow.innerHTML = '';
            currentProductState.color.images.forEach((imgSrc, index) => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = 'w-full h-full object-cover absolute transition-opacity duration-300';
                img.style.opacity = index === currentProductState.slideIndex ? '1' : '0';
                slideshow.appendChild(img);
            });
            prevBtn.style.display = currentProductState.color.images.length > 1 ? 'flex' : 'none';
            nextBtn.style.display = currentProductState.color.images.length > 1 ? 'flex' : 'none';

            // Actualizar precio total
            const variantPrice = getPrice(currentProductState.variant, currentProductState.size);
            const total = variantPrice * currentProductState.quantity;
            modalTotalPrice.textContent = formatPrice(total);
        }

        function addToCart() {
            const price = getPrice(currentProductState.variant, currentProductState.size);
            const cartItem = {
                cartId: Date.now(),
                productId: currentProductState.product.id,
                name: currentProductState.product.name,
                style: currentProductState.variant.style,
                color: currentProductState.color.name,
                price: price,
                quantity: currentProductState.quantity,
                size: currentProductState.size,
                specs: customSpecsInput.value,
                image: currentProductState.color.images[0]
            };
            cart.push(cartItem);
            updateCartUI();
            productDetailModal.classList.add('hidden');
        }

        function updateCartUI() {
            renderCartItems();
            updateCartTotals();
            updateCartCount();
        }

        function renderCartItems() {
            cartItemsContainer.innerHTML = '';
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-gray-400 text-center">Tu carrito está vacío.</p>';
                return;
            }
            cart.forEach(item => {
                let details = `Estilo: ${item.style}, Color: ${item.color}`;
                if (item.size) details += `, Talla: ${item.size}`;
                cartItemsContainer.innerHTML += `
                    <div class="flex items-start justify-between py-3 border-b border-gray-600 last:border-b-0">
                        <div class="flex items-start gap-4">
                            <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-cover rounded-md">
                            <div>
                                <p class="font-semibold text-white">${item.name} (x${item.quantity})</p>
                                <p class="text-sm text-gray-400">${details}</p>
                                ${item.specs ? `<p class="text-xs text-gray-400 mt-1 italic">"${item.specs}"</p>` : ''}
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-semibold text-white">${formatPrice(item.price * item.quantity)}</p>
                            <button class="text-red-400 text-xs hover:underline" data-cart-id="${item.cartId}">Eliminar</button>
                        </div>
                    </div>`;
            });
        }
        
        function updateCartTotals() {
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const tax = subtotal * (TAX_RATE / 100);
            const total = subtotal + tax;
            cartSubtotalEl.textContent = formatPrice(subtotal);
            cartTaxEl.textContent = formatPrice(tax);
            cartTotalEl.textContent = formatPrice(total);
        }

        function updateCartCount() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;
        }

        function checkout(customerName) {
            if (cart.length === 0) return;
            let message = `¡Hola! 👋 Mi nombre es ${customerName} y me gustaría hacer el siguiente pedido:\n\n`;
            cart.forEach(item => {
                message += `*Producto:* ${item.name}\n`;
                message += `*Estilo:* ${item.style}\n`;
                message += `*Color:* ${item.color}\n`;
                if (item.size) message += `*Talla:* ${item.size}\n`;
                message += `*Cantidad:* ${item.quantity}\n`;
                if (item.specs) message += `*Especificaciones:* ${item.specs}\n`;
                message += `*Precio Unitario:* ${formatPrice(item.price)}\n`;
                message += '------------------------\n';
            });
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const tax = subtotal * (TAX_RATE / 100);
            const total = subtotal + tax;
            message += `\n*Subtotal:* ${formatPrice(subtotal)}`;
            message += `\n*Impuestos (${TAX_RATE}%):* ${formatPrice(tax)}`;
            message += `\n*TOTAL DEL PEDIDO:* ${formatPrice(total)}`;
            
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // ========== MANEJADORES DE EVENTOS ==========
        productGrid.addEventListener('click', (e) => {
            const card = e.target.closest('.product-card');
            if (card) openProductModal(parseInt(card.dataset.id));
        });

        [closeCartBtn, closeProductModalBtn, cancelNameBtn].forEach(btn => btn.addEventListener('click', () => {
            cartModal.classList.add('hidden');
            productDetailModal.classList.add('hidden');
            nameModal.classList.add('hidden');
        }));
        [cartModal, productDetailModal, nameModal].forEach(modal => modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.add('hidden');
        }));
        cartButton.addEventListener('click', () => cartModal.classList.remove('hidden'));
        
        stylesContainer.addEventListener('click', (e) => {
            const target = e.target.closest('.selection-button');
            if (target) {
                stylesContainer.querySelector('.selected').classList.remove('selected');
                target.classList.add('selected');
                
                const newVariant = currentProductState.product.variants[target.dataset.index];
                currentProductState.variant = newVariant;
                currentProductState.color = newVariant.colors[0]; // Reset color to first available
                currentProductState.slideIndex = 0;
                
                populateColors(newVariant.colors, 0); // Repopulate colors for new style
                updateProductModalUI();
            }
        });

        colorsContainer.addEventListener('click', (e) => {
            const target = e.target.closest('.color-swatch');
            if (target) {
                colorsContainer.querySelector('.selected').classList.remove('selected');
                target.classList.add('selected');
                currentProductState.color = currentProductState.variant.colors[target.dataset.index];
                currentProductState.slideIndex = 0;
                updateProductModalUI();
            }
        });

        sizesContainer.addEventListener('click', (e) => {
             const target = e.target.closest('.selection-button');
            if (target) {
                sizesContainer.querySelector('.selected').classList.remove('selected');
                target.classList.add('selected');
                currentProductState.size = target.dataset.size;
                updateProductModalUI(); // Update price when size changes
            }
        });

        quantityInput.addEventListener('input', () => {
            currentProductState.quantity = parseInt(quantityInput.value) || 1;
            updateProductModalUI();
        });
        
        nextBtn.addEventListener('click', () => {
            const maxIndex = currentProductState.color.images.length - 1;
            currentProductState.slideIndex = currentProductState.slideIndex < maxIndex ? currentProductState.slideIndex + 1 : 0;
            updateProductModalUI();
        });
        
        prevBtn.addEventListener('click', () => {
            const maxIndex = currentProductState.color.images.length - 1;
            currentProductState.slideIndex = currentProductState.slideIndex > 0 ? currentProductState.slideIndex - 1 : maxIndex;
            updateProductModalUI();
        });

        addToCartModalBtn.addEventListener('click', addToCart);
        
        cartItemsContainer.addEventListener('click', (e) => {
            if (e.target.dataset.cartId) {
                const cartId = parseInt(e.target.dataset.cartId);
                cart = cart.filter(item => item.cartId !== cartId);
                updateCartUI();
            }
        });
        
        checkoutBtn.addEventListener('click', () => {
            if (cart.length === 0) return;
            nameModal.classList.remove('hidden');
            customerNameInput.focus();
        });

        confirmNameBtn.addEventListener('click', () => {
            const customerName = customerNameInput.value.trim();
            if (customerName) {
                checkout(customerName);
                nameModal.classList.add('hidden');
                customerNameInput.value = '';
                customerNameInput.classList.remove('border-red-500');
            } else {
                customerNameInput.classList.add('border-red-500');
            }
        });
        
        customerNameInput.addEventListener('input', () => {
            if(customerNameInput.value.trim()){
                 customerNameInput.classList.remove('border-red-500');
            }
        });

        // ========== INICIALIZACIÓN CON GEOLOCALIZACIÓN ==========
        async function initializeApp() {
            try {
                const response = await fetch('https://ipinfo.io/json');
                if (!response.ok) throw new Error('API de geolocalización falló');
                const data = await response.json();

                if (data.country === 'DO') {
                    whatsappNumber = '18293973360';
                    TAX_RATE = 18; // ITBIS en RD
                    currencySymbol = 'RD$';
                    currencyCode = 'DOP';
                }
            } catch (error) {
                console.error('Error obteniendo la ubicación, se usarán los valores por defecto:', error);
            } finally {
                taxRateDisplay.textContent = TAX_RATE;
                renderProducts();
                updateCartUI();
            }
        }
        
        initializeApp();
    });
    </script>
